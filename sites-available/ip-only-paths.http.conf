# IP-only fallback when you do not have DNS names yet.
# Example: http://123.45.67.89/rms/ and http://123.45.67.89/asset-manager/
# Notes:
# - You cannot rely on hostnames like rms.123.45.67.89 publicly unless DNS resolves them.
# - HTTPS for bare IP needs a self-signed/private CA cert or your own certificate.

upstream rms_web {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream ams_web {
    server 127.0.0.1:5174;
}

upstream ams_api {
    server 127.0.0.1:3004;
}

upstream ghs_web {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    # RMS app
    location /rms/api/ {
        rewrite ^/rms/api/?(.*)$ /$1 break;
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }

    location /rms/ {
        rewrite ^/rms/?(.*)$ /$1 break;
        proxy_pass http://rms_web;
        include snippets/proxy-common.conf;
    }

    # AMS app
    location /ams/api/ {
        rewrite ^/ams/api/?(.*)$ /$1 break;
        proxy_pass http://ams_api;
        include snippets/proxy-common.conf;
    }

    location /ams/ {
        rewrite ^/ams/?(.*)$ /$1 break;
        proxy_pass http://ams_web;
        include snippets/proxy-common.conf;
    }

    # Golf Handicap System app
    location /ghs/api/ {
        rewrite ^/ghs/api/?(.*)$ /$1 break;
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }

    location /ghs/ {
        rewrite ^/ghs/?(.*)$ /$1 break;
        proxy_pass http://ghs_web;
        include snippets/proxy-common.conf;
    }

    location = / {
        return 200 "NGINX is running. Use /rms/, /asset-manager/, or /ghs/.\n";
        add_header Content-Type text/plain;
    }
}
