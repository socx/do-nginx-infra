# One app per domain, HTTP only.
# Example:
# - rms.example.com            -> 127.0.0.1:5173
# - api.rms.example.com        -> 127.0.0.1:3000
# - ams.app          -> 127.0.0.1:5174
# - api.ams.app      -> 127.0.0.1:3004
# - golf-handicap-system.dev   -> 127.0.0.1:5175
# - api.golf-handicap-system.dev -> 127.0.0.1:3005

upstream rms_web {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream ams_web {
    server 127.0.0.1:5174;
}

upstream ams_api {
    server 127.0.0.1:3004;
}

upstream ghs_web {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80;
    listen [::]:80;
    server_name rms.example.com;

    location / {
        proxy_pass http://rms_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.rms.example.com;

    location / {
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ams.app;

    location / {
        proxy_pass http://ams_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ams.app;

    location / {
        proxy_pass http://ams_api;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name golf-handicap-system.dev;

    location / {
        proxy_pass http://ghs_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.golf-handicap-system.dev;

    location / {
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }
}
