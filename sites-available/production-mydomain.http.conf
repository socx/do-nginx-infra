# Production profile: DNS routing for socx.org.uk.
# Desired public URLs:
# - http://www.socx.org.uk
# - http://rms.socx.org.uk
# - http://ams.socx.org.uk
# - http://ghs.socx.org.uk
#
# API is mapped to /api on each host.

upstream www_web {
    server 127.0.0.1:5172;
}

upstream www_api {
    server 127.0.0.1:3002;
}

upstream rms_web {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream ams_web {
    server 127.0.0.1:5174;
}

upstream ams_api {
    server 127.0.0.1:3004;
}

upstream ghs_web {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80;
    listen [::]:80;
    server_name socx.org.uk;
    return 301 http://www.socx.org.uk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.socx.org.uk;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://www_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://www_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rms.socx.org.uk;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://rms_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ams.socx.org.uk;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://ams_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://ams_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ghs.socx.org.uk;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://ghs_web;
        include snippets/proxy-common.conf;
    }
}
