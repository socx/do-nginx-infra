# Production profile: DNS routing for mydomain.com.
# Desired public URLs:
# - http://www.mydomain.com
# - http://rms.mydomain.com
# - http://asset-manager.mydomain.com
# - http://ghs.mydomain.com
#
# API is mapped to /api on each host.

upstream www_frontend {
    server 127.0.0.1:5172;
}

upstream www_api {
    server 127.0.0.1:3002;
}

upstream rms_frontend {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream asset_frontend {
    server 127.0.0.1:5174;
}

upstream asset_api {
    server 127.0.0.1:3004;
}

upstream ghs_frontend {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80;
    listen [::]:80;
    server_name mydomain.com;
    return 301 http://www.mydomain.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.mydomain.com;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://www_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://www_frontend;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rms.mydomain.com;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://rms_frontend;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name asset-manager.mydomain.com;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://asset_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://asset_frontend;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ghs.mydomain.com;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://ghs_frontend;
        include snippets/proxy-common.conf;
    }
}
