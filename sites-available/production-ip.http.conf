# Production profile: IP-only routing before DNS exists.
# Main app is served at root path (/).
# Other apps are routed by path prefixes.

upstream www_web {
    server 127.0.0.1:5172;
}

upstream www_api {
    server 127.0.0.1:3002;
}

upstream rms_web {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream ams_web {
    server 127.0.0.1:5174;
}

upstream ams_api {
    server 127.0.0.1:3004;
}

upstream ghs_web {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    # Main app API at /api
    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://www_api;
        include snippets/proxy-common.conf;
    }

    # Main app web at /
    location / {
        proxy_pass http://www_web;
        include snippets/proxy-common.conf;
    }

    # RMS app
    location /rms/api/ {
        rewrite ^/rms/api/?(.*)$ /$1 break;
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }

    location /rms/ {
        rewrite ^/rms/?(.*)$ /$1 break;
        proxy_pass http://rms_web;
        include snippets/proxy-common.conf;
    }

    # AMS app
    location /ams/api/ {
        rewrite ^/ams/api/?(.*)$ /$1 break;
        proxy_pass http://ams_api;
        include snippets/proxy-common.conf;
    }

    location /ams/ {
        rewrite ^/ams/?(.*)$ /$1 break;
        proxy_pass http://ams_web;
        include snippets/proxy-common.conf;
    }

    # GHS app
    location /ghs/api/ {
        rewrite ^/ghs/api/?(.*)$ /$1 break;
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }

    location /ghs/ {
        rewrite ^/ghs/?(.*)$ /$1 break;
        proxy_pass http://ghs_web;
        include snippets/proxy-common.conf;
    }
}
