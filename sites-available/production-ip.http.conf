# Production profile: IP-only routing before DNS exists.
# Main app is served at root path (/).
# Other apps are routed by path prefixes.

upstream www_frontend {
    server 127.0.0.1:5172;
}

upstream www_api {
    server 127.0.0.1:3002;
}

upstream rms_frontend {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream asset_frontend {
    server 127.0.0.1:5174;
}

upstream asset_api {
    server 127.0.0.1:3004;
}

upstream ghs_frontend {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    # Main app API at /api
    location /api/ {
        proxy_pass http://www_api;
        include snippets/proxy-common.conf;
    }

    # Main app frontend at /
    location / {
        proxy_pass http://www_frontend;
        include snippets/proxy-common.conf;
    }

    # RMS app
    location /rms/api/ {
        rewrite ^/rms/api/?(.*)$ /$1 break;
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }

    location /rms/ {
        rewrite ^/rms/?(.*)$ /$1 break;
        proxy_pass http://rms_frontend;
        include snippets/proxy-common.conf;
    }

    # Asset Manager app
    location /asset-manager/api/ {
        rewrite ^/asset-manager/api/?(.*)$ /$1 break;
        proxy_pass http://asset_api;
        include snippets/proxy-common.conf;
    }

    location /asset-manager/ {
        rewrite ^/asset-manager/?(.*)$ /$1 break;
        proxy_pass http://asset_frontend;
        include snippets/proxy-common.conf;
    }

    # GHS app
    location /ghs/api/ {
        rewrite ^/ghs/api/?(.*)$ /$1 break;
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }

    location /ghs/ {
        rewrite ^/ghs/?(.*)$ /$1 break;
        proxy_pass http://ghs_frontend;
        include snippets/proxy-common.conf;
    }
}
