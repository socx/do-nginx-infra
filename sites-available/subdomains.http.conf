# Single apex domain with subdomains, HTTP only.
# Example:
# - rms.example.com           -> 127.0.0.1:5173
# - api.rms.example.com       -> 127.0.0.1:3000
# - asset-manager.example.com -> 127.0.0.1:5174
# - api.asset-manager.example.com -> 127.0.0.1:3004
# - ghs.example.com           -> 127.0.0.1:5175
# - api.ghs.example.com       -> 127.0.0.1:3005

upstream rms_frontend {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream asset_frontend {
    server 127.0.0.1:5174;
}

upstream asset_api {
    server 127.0.0.1:3004;
}

upstream ghs_frontend {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80;
    listen [::]:80;
    server_name rms.example.com;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location / {
        proxy_pass http://rms_frontend;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.rms.example.com;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name asset-manager.example.com;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location / {
        proxy_pass http://asset_frontend;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.asset-manager.example.com;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://asset_api;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ghs.example.com;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location / {
        proxy_pass http://ghs_frontend;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ghs.example.com;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }
}
