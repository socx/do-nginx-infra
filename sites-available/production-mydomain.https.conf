# Production profile: HTTPS routing for socx.org.uk.
# Public URLs:
# - https://www.socx.org.uk
# - https://rms.socx.org.uk
# - https://ams.socx.org.uk
# - https://ghs.socx.org.uk
#
# API is mapped to /api on each host.

upstream www_web {
    server 127.0.0.1:5172;
}

upstream www_api {
    server 127.0.0.1:3002;
}

upstream rms_web {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream ams_web {
    server 127.0.0.1:5174;
}

upstream ams_api {
    server 127.0.0.1:3004;
}

upstream ghs_web {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80;
    listen [::]:80;
    server_name socx.org.uk www.socx.org.uk rms.socx.org.uk ams.socx.org.uk ghs.socx.org.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name socx.org.uk;

    ssl_certificate /etc/letsencrypt/live/socx.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socx.org.uk/privkey.pem;
    include snippets/ssl-common.conf;

    return 301 https://www.socx.org.uk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.socx.org.uk;

    ssl_certificate /etc/letsencrypt/live/socx.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socx.org.uk/privkey.pem;
    include snippets/ssl-common.conf;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://www_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://www_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rms.socx.org.uk;

    ssl_certificate /etc/letsencrypt/live/rms.socx.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rms.socx.org.uk/privkey.pem;
    include snippets/ssl-common.conf;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://rms_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ams.socx.org.uk;

    ssl_certificate /etc/letsencrypt/live/ams.socx.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ams.socx.org.uk/privkey.pem;
    include snippets/ssl-common.conf;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://ams_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://ams_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ghs.socx.org.uk;

    ssl_certificate /etc/letsencrypt/live/ghs.socx.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghs.socx.org.uk/privkey.pem;
    include snippets/ssl-common.conf;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://ghs_web;
        include snippets/proxy-common.conf;
    }
}
