# Production profile: HTTPS routing for mydomain.com.
# Public URLs:
# - https://www.mydomain.com
# - https://rms.mydomain.com
# - https://asset-manager.mydomain.com
# - https://ghs.mydomain.com
#
# API is mapped to /api on each host.

upstream www_frontend {
    server 127.0.0.1:5172;
}

upstream www_api {
    server 127.0.0.1:3002;
}

upstream rms_frontend {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream asset_frontend {
    server 127.0.0.1:5174;
}

upstream asset_api {
    server 127.0.0.1:3004;
}

upstream ghs_frontend {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80;
    listen [::]:80;
    server_name mydomain.com www.mydomain.com rms.mydomain.com asset-manager.mydomain.com ghs.mydomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mydomain.com;

    ssl_certificate /etc/letsencrypt/live/mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydomain.com/privkey.pem;
    include snippets/ssl-common.conf;

    return 301 https://www.mydomain.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mydomain.com;

    ssl_certificate /etc/letsencrypt/live/www.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mydomain.com/privkey.pem;
    include snippets/ssl-common.conf;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://www_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://www_frontend;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rms.mydomain.com;

    ssl_certificate /etc/letsencrypt/live/rms.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rms.mydomain.com/privkey.pem;
    include snippets/ssl-common.conf;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://rms_frontend;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asset-manager.mydomain.com;

    ssl_certificate /etc/letsencrypt/live/asset-manager.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asset-manager.mydomain.com/privkey.pem;
    include snippets/ssl-common.conf;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://asset_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://asset_frontend;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ghs.mydomain.com;

    ssl_certificate /etc/letsencrypt/live/ghs.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghs.mydomain.com/privkey.pem;
    include snippets/ssl-common.conf;

    client_max_body_size 25m;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://ghs_frontend;
        include snippets/proxy-common.conf;
    }
}
