# One app per domain with HTTPS.
# Replace domain names and cert paths.

upstream rms_web {
    server 127.0.0.1:5173;
}

upstream rms_api {
    server 127.0.0.1:3000;
}

upstream ams_web {
    server 127.0.0.1:5174;
}

upstream ams_api {
    server 127.0.0.1:3004;
}

upstream ghs_web {
    server 127.0.0.1:5175;
}

upstream ghs_api {
    server 127.0.0.1:3005;
}

server {
    listen 80;
    listen [::]:80;
    server_name rms.example.com api.rms.example.com asset-manager.app api.asset-manager.app golf-handicap-system.dev api.golf-handicap-system.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rms.example.com;

    ssl_certificate /etc/letsencrypt/live/rms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rms.example.com/privkey.pem;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location / {
        proxy_pass http://rms_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rms.example.com;

    ssl_certificate /etc/letsencrypt/live/api.rms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rms.example.com/privkey.pem;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://rms_api;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asset-manager.app;

    ssl_certificate /etc/letsencrypt/live/asset-manager.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asset-manager.app/privkey.pem;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location / {
        proxy_pass http://ams_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.asset-manager.app;

    ssl_certificate /etc/letsencrypt/live/api.asset-manager.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.asset-manager.app/privkey.pem;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://ams_api;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name golf-handicap-system.dev;

    ssl_certificate /etc/letsencrypt/live/golf-handicap-system.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/golf-handicap-system.dev/privkey.pem;

    include snippets/gzip.conf;
    include snippets/security-headers.conf;

    location / {
        proxy_pass http://ghs_web;
        include snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.golf-handicap-system.dev;

    ssl_certificate /etc/letsencrypt/live/api.golf-handicap-system.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.golf-handicap-system.dev/privkey.pem;

    include snippets/security-headers.conf;

    location / {
        proxy_pass http://ghs_api;
        include snippets/proxy-common.conf;
    }
}
