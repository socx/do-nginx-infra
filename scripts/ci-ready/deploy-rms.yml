name: Deploy rms

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rms
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test API
        working-directory: api
        run: |
          npm ci
          npm test --if-present

      - name: Package repo
        run: tar --exclude='.git' --exclude='**/node_modules' -czf release.tgz .

      - name: Upload to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "release.tgz"
          target: "/tmp"

      - name: Deploy and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_USER="$(id -un)"
            APP_DIR="/opt/apps/rms"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$DEPLOY_USER:$DEPLOY_USER" "$APP_DIR"
            tar -xzf /tmp/release.tgz -C "$APP_DIR"
            rm -f /tmp/release.tgz

            cd "$APP_DIR/web" && npm ci --omit=dev || true
            cd "$APP_DIR/api" && npm ci --omit=dev || true
            if [ -d "$APP_DIR/worker" ]; then
              cd "$APP_DIR/worker"
              python3 -m venv .venv
              . .venv/bin/activate
              python -m pip install --upgrade pip
              if [ -f requirements.txt ]; then
                pip install -r requirements.txt
              elif [ -f pyproject.toml ]; then
                pip install .
              fi
            fi

            sudo systemctl daemon-reload
            for svc in rms-web rms-api rms-worker; do
              if systemctl list-unit-files --type=service | grep -q "^${svc}\.service"; then
                sudo systemctl enable "$svc"
                sudo systemctl restart "$svc"
                sudo systemctl status "$svc" --no-pager || true
              else
                echo "Skipping missing unit: ${svc}.service"
              fi
            done
